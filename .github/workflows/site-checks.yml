name: Site regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check js/main.js && node --check service-worker.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: output/playwright/
