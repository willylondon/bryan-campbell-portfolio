name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/add-invoice-app
    paths:
      - invoice-app/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: invoice-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invoice-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and sync Android project
        run: npm run android:sync

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: invoice-app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: master-bryan-kukibo-apk
          path: invoice-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
